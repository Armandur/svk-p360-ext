name: Bygg tillägg

on:
  push:
    branches:
      - main
      - dev
      - 'claude/**'

jobs:
  bygg:
    name: Paketera tillägg
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Läs version från manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_plain=$VERSION" >> $GITHUB_OUTPUT

      - name: Skapa zip
        run: |
          zip -r extension-${{ steps.version.outputs.version }}.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "CLAUDE.md" \
            --exclude "ROADMAP.md" \
            --exclude "docs/*" \
            --exclude "hosting/*"

      - name: Paketera CRX
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # Kopiera tillägget (google-chrome-stable är förinstallerat som deb – ej snap)
          mkdir -p "$HOME/ext"
          rsync -a . "$HOME/ext/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='CLAUDE.md' \
            --exclude='ROADMAP.md' \
            --exclude='docs' \
            --exclude='hosting'

          # Återskapa privat nyckel från secret
          echo "$CRX_PRIVATE_KEY" | base64 -d > "$HOME/svk-p360-ext.pem"

          # Packa och signera tillägget med google-chrome-stable (ej snap)
          google-chrome-stable --pack-extension="$HOME/ext" --pack-extension-key="$HOME/svk-p360-ext.pem"

          mv "$HOME/ext.crx" svk-p360-ext.crx

      - name: Generera index.html med version och datum
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          DATE=$(date +'%-d %B %Y' --locale=sv_SE 2>/dev/null || date +'%Y-%m-%d')
          VERSION_PLAIN=$(jq -r '.version' manifest.json)
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{VERSION_PLAIN}}/$VERSION_PLAIN/g" \
              -e "s/{{DATE}}/$DATE/g" \
              hosting/index.html > index.html

      # --- Utvecklingsbygge (dev / claude/**) ---
      - name: Ladda upp som artefakt (utvecklingsbygge)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: tillagg-dev-${{ github.sha }}
          path: |
            extension-${{ steps.version.outputs.version }}.zip
            svk-p360-ext.crx
            index.html
          retention-days: 14

      # --- Release (main) ---
      - name: Skapa GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          body: |
            ## Installation

            1. Ladda ned `extension-${{ steps.version.outputs.version }}.zip` nedan.
            2. Packa upp ZIP-filen till en **fast** mapp på din dator (t.ex. `Dokument\svk-p360-ext`).
               Mappen ska innehålla `manifest.json` direkt – inte en undermapp. Flytta inte mappen efteråt.
            3. Öppna `edge://extensions` (Edge) eller `chrome://extensions` (Chrome).
            4. Aktivera **Utvecklarläge** med reglaget uppe till vänster.
            5. Klicka **Läs in okomprimerat tillägg** och välj mappen från steg 2.

            **Uppdatering:** packa upp den nya ZIP-filen till samma mapp (skriv över) och klicka ⟳ på tilläggssidan.

            ## För IT-administratörer

            `svk-p360-ext.crx` medföljer för distribution via `ExtensionInstallForcelist`-grupprincip
            på domänanslutna datorer (AD/Intune). Se [Microsofts dokumentation](https://learn.microsoft.com/en-us/deployedge/microsoft-edge-manage-extensions-policies).

            Fullständig dokumentation: [README](https://github.com/Armandur/svk-p360-ext#readme)
          files: |
            extension-${{ steps.version.outputs.version }}.zip
            svk-p360-ext.crx
            index.html
          fail_on_unmatched_files: true
