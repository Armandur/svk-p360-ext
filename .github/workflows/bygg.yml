name: Bygg tillägg

on:
  push:
    branches:
      - main
      - dev
      - 'claude/**'

jobs:
  bygg:
    name: Paketera tillägg
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Läs version från manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skapa zip
        run: |
          zip -r extension-${{ steps.version.outputs.version }}.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "CLAUDE.md" \
            --exclude "ROADMAP.md" \
            --exclude "docs/*" \
            --exclude "hosting/*"

      - name: Installera Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Paketera CRX
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # Kopiera tillägget till en temporär katalog
          mkdir -p /tmp/ext
          rsync -a . /tmp/ext/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='CLAUDE.md' \
            --exclude='ROADMAP.md' \
            --exclude='docs' \
            --exclude='hosting'

          # Återskapa privat nyckel från secret
          echo "$CRX_PRIVATE_KEY" | base64 -d > /tmp/svk-p360-ext.pem

          # Packa och signera tillägget
          chromium-browser --pack-extension=/tmp/ext --pack-extension-key=/tmp/svk-p360-ext.pem

          mv /tmp/ext.crx svk-p360-ext.crx

      - name: Generera index.html med version och datum
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          DATE=$(date +'%-d %B %Y' --locale=sv_SE 2>/dev/null || date +'%Y-%m-%d')
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{DATE}}/$DATE/g" \
              hosting/index.html > index.html

      # --- Utvecklingsbygge (dev / claude/**) ---
      - name: Ladda upp som artefakt (utvecklingsbygge)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: tillagg-dev-${{ github.sha }}
          path: |
            extension-${{ steps.version.outputs.version }}.zip
            svk-p360-ext.crx
            index.html
          retention-days: 14

      # --- Release (main) ---
      - name: Skapa GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          body: |
            ## Installation via webbsida (rekommenderat)

            Lägg `index.html` och `svk-p360-ext.crx` på din webbserver. Användarna öppnar sidan och drar in `.crx`-filen på `edge://extensions`.

            ## Installation manuellt (utan webbserver)

            1. Ladda ned `extension-${{ steps.version.outputs.version }}.zip` nedan.
            2. Packa upp ZIP-filen till en valfri mapp på din dator.
               Mappen ska innehålla `manifest.json` direkt – inte en undermapp.
            3. Öppna `edge://extensions` (Edge) eller `chrome://extensions` (Chrome).
            4. Aktivera **Utvecklarläge** med reglaget uppe till vänster.
            5. Klicka **Läs in okomprimerat tillägg** och välj mappen.

            **Uppdatering (manuell):** packa upp den nya ZIP-filen till samma mapp och klicka ⟳ på tilläggssidan.

            Fullständig dokumentation: [README](https://github.com/Armandur/svk-p360-ext#readme)
          files: |
            extension-${{ steps.version.outputs.version }}.zip
            svk-p360-ext.crx
            index.html
          fail_on_unmatched_files: true
