name: Bygg tillägg

on:
  push:
    branches:
      - main
      - dev
      - 'claude/**'

jobs:
  bygg:
    name: Paketera tillägg
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Läs version från manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skapa zip
        run: |
          zip -r extension-${{ steps.version.outputs.version }}.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "CLAUDE.md" \
            --exclude "ROADMAP.md" \
            --exclude "docs/*"

      # --- Utvecklingsbygge (dev / claude/**) ---
      - name: Ladda upp som artefakt (utvecklingsbygge)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: tillagg-dev-${{ github.sha }}
          path: extension-${{ steps.version.outputs.version }}.zip
          retention-days: 14

      # --- Release (main) ---
      - name: Skapa GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          body: |
            ## Installation

            1. Ladda ned `extension-${{ steps.version.outputs.version }}.zip` nedan.
            2. Packa upp ZIP-filen till en valfri mapp på din dator (t.ex. `C:\Tillägg\360-hjalptillagg\`).
               Mappen ska innehålla `manifest.json` direkt – inte en undermapp.
            3. Öppna **`edge://extensions`** (Edge) eller **`chrome://extensions`** (Chrome).
            4. Aktivera **Utvecklarläge** med reglaget uppe till vänster.
            5. Klicka på **Läs in okomprimerat tillägg** och välj den uppackade mappen.

            **Uppdatering:** packa upp den nya ZIP-filen till samma mapp och klicka på ⟳ på tilläggssidan.

            Fullständig dokumentation finns i [README](https://github.com/Armandur/svk-p360-ext#readme).
          files: extension-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
