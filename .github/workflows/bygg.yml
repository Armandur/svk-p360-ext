name: Bygg tillägg

on:
  push:
    branches:
      - main
      - dev
      - 'claude/**'

jobs:
  bygg:
    name: Paketera tillägg
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Läs version från manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skapa zip
        run: |
          zip -r extension-${{ steps.version.outputs.version }}.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "CLAUDE.md" \
            --exclude "ROADMAP.md" \
            --exclude "docs/*" \
            --exclude "hosting/*"

      - name: Generera index.html med version och datum
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          DATE=$(date +'%-d %B %Y' --locale=sv_SE 2>/dev/null || date +'%Y-%m-%d')
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{DATE}}/$DATE/g" \
              hosting/index.html > index.html

      # --- Utvecklingsbygge (dev / claude/**) ---
      - name: Ladda upp som artefakt (utvecklingsbygge)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: tillagg-dev-${{ github.sha }}
          path: |
            extension.zip
            index.html
          path: extension-${{ steps.version.outputs.version }}.zip
          retention-days: 14

      # --- Release (main) ---
      - name: Skapa GitHub Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Version ${{ steps.version.outputs.version }}
          body: |
            Automatiskt byggd release från main.
            Ladda in `extension.zip` som ett okomprimerat tillägg i Chrome eller Edge.
            Ladda ned `index.html` och lägg på din webbserver tillsammans med `extension.crx`.
          files: |
            extension.zip
            index.html
            Ladda in `extension-${{ steps.version.outputs.version }}.zip` som ett okomprimerat tillägg i Chrome eller Edge.
          files: extension-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
