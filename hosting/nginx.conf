server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Korrekt MIME-typ för .crx så att webbläsaren
    # erbjuder nedladdning och inte blockerar filen
    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        application/x-chrome-extension crx;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Förhindra att .pem-nyckeln råkar exponeras om den
    # läggs i samma katalog av misstag
    location ~* \.pem$ {
        deny all;
        return 404;
    }
}
