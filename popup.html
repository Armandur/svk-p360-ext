<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>360° Hjälptillägg</title>
  <style>
    body {
      min-width: 280px;
      padding: 12px;
      font-family: sans-serif;
      font-size: 14px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #333;
    }
    .grupp {
      margin-bottom: 10px;
    }
    .grupp-rubrik {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 4px;
    }
    button {
      width: 100%;
      padding: 7px 10px;
      margin: 2px 0;
      cursor: pointer;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: left;
      font-size: 13px;
    }
    button:hover {
      background: #e8e8e8;
    }
    .status-rad {
      display: flex;
      gap: 4px;
      margin: 2px 0;
    }
    .status-rad select {
      flex: 1;
      padding: 6px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      background: #f5f5f5;
    }
    .status-rad button {
      width: auto;
      flex-shrink: 0;
      margin: 0;
    }
    #felmeddelande {
      display: none;
      position: sticky;
      top: 0;
      z-index: 100;
      margin: -12px -12px 10px -12px;
      padding: 8px 36px 8px 10px;
      background: #f8d7da;
      border-bottom: 2px solid #f5c2c7;
      font-size: 12px;
      color: #842029;
      font-weight: 500;
    }
    #felmeddelande-stang {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      color: #842029;
      padding: 0 2px;
      width: auto;
      margin: 0;
    }

    /* Mallsektionen */
    .mall-rad {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 2px 0;
    }
    .mall-rad .mall-namn {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mall-rad .mall-knappar {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .mall-rad .mall-knappar button {
      width: auto;
      padding: 4px 8px;
      margin: 0;
      font-size: 12px;
    }
    .btn-använd {
      background: #0078d4;
      color: #fff;
      border-color: #0078d4 !important;
    }
    .btn-använd:hover {
      background: #006cbf !important;
    }

    #tom-malllista {
      font-size: 12px;
      color: #aaa;
      padding: 4px 0;
    }

    #btn-ny-mall {
      border-style: dashed;
      color: #0078d4;
      background: #fff;
      font-size: 12px;
      margin-top: 4px;
    }
    #btn-ny-mall:hover {
      background: #f0f6ff;
    }

    /* Titel-inmatningsruta som visas när "Använd" klickas */
    #mall-titel-panel {
      display: none;
      margin-top: 6px;
      padding: 8px;
      background: #f0f6ff;
      border: 1px solid #c2d8f5;
      border-radius: 4px;
    }
    #mall-titel-panel label {
      font-size: 11px;
      color: #555;
      display: block;
      margin-bottom: 3px;
    }
    #mall-titel-panel input {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 13px;
      margin-bottom: 6px;
      box-sizing: border-box;
    }
    #mall-titel-panel .panel-knappar {
      display: flex;
      gap: 4px;
    }
    #mall-titel-panel .panel-knappar button {
      flex: 1;
      margin: 0;
      padding: 6px;
      font-size: 12px;
    }
    #btn-skapa-ärende {
      background: #0078d4;
      color: #fff;
      border-color: #0078d4;
    }
    #btn-skapa-ärende:hover {
      background: #006cbf;
    }
  </style>
</head>
<body>
  <div id="felmeddelande"><button id="felmeddelande-stang" title="Stäng">&#x2715;</button><span id="felmeddelande-text"></span></div>

  <h3>360° Verktyg</h3>

  <!-- Mallar (ärendemallar + dokumentmallar) -->
  <div class="grupp">
    <div class="grupp-rubrik">Mallar</div>
    <div class="grupp-rubrik" style="margin-top:6px;color:#555;">Ärendemallar</div>
    <div id="malllista">
      <div id="tom-malllista">Inga mallar ännu.</div>
    </div>
    <!-- Panel för titeljustering innan skapande -->
    <div id="mall-titel-panel">
      <label for="mall-titel-input">Ärendetitel</label>
      <input type="text" id="mall-titel-input" placeholder="Ärendetitel">
      <div class="panel-knappar">
        <button id="btn-skapa-ärende">Skapa ärende</button>
        <button id="btn-avbryt-panel" style="width:auto;">Avbryt</button>
      </div>
    </div>
    <button id="btn-ny-mall">＋ Ny mall</button>

    <div class="grupp-rubrik" style="margin-top:10px;">Dokumentmallar</div>
    <div id="dokumentmalllista">
      <div id="tom-dokumentmalllista" style="font-size:12px;color:#aaa;padding:4px 0;">Inga dokumentmallar.</div>
    </div>
    <button id="btn-ny-dokumentmall" style="border-style:dashed;color:#0078d4;background:#fff;font-size:12px;margin-top:4px;">＋ Ny dokumentmall</button>

    <!-- Export / import av alla mallar -->
    <div style="display:flex;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid #eee;">
      <button id="btn-exportera-mallar" style="flex:1;font-size:11px;padding:5px 0;border-style:dashed;color:#555;background:#fff;">↓ Exportera mallar</button>
      <button id="btn-importera-mallar" style="flex:1;font-size:11px;padding:5px 0;border-style:dashed;color:#555;background:#fff;">↑ Importera mallar</button>
    </div>
    <input type="file" id="import-fil-input" accept=".json" style="display:none;">
    <div id="import-panel" style="display:none;margin-top:6px;padding:8px;background:#f0f6ff;border:1px solid #c2d8f5;border-radius:4px;">
      <div id="import-info" style="font-size:11px;color:#333;margin-bottom:6px;"></div>
      <div style="display:flex;gap:4px;">
        <button id="btn-import-samman" style="flex:1;margin:0;font-size:11px;padding:5px;">Slå samman</button>
        <button id="btn-import-ersätt" style="flex:1;margin:0;font-size:11px;padding:5px;background:#d32f2f;color:#fff;border-color:#d32f2f;">Ersätt allt</button>
        <button id="btn-import-avbryt" style="width:auto;margin:0;font-size:11px;padding:5px;">Avbryt</button>
      </div>
    </div>
  </div>

  <!-- Filuppladdning -->
  <div class="grupp">
    <div class="grupp-rubrik">Filuppladdning</div>
    <button id="btn-ladda-upp-filer">Ladda upp fil(er) till nytt ärendedokument</button>
    <input type="file" id="fil-input" multiple style="display:none;">
    <!-- Panel: välj dokumentmall för fil-uppladdning -->
    <div id="fil-panel" style="display:none;margin-top:6px;padding:8px;background:#f0f6ff;border:1px solid #c2d8f5;border-radius:4px;">
      <div style="font-size:11px;color:#555;margin-bottom:4px;" id="fil-panel-info"></div>
      <label style="font-size:11px;color:#555;display:block;margin-bottom:3px;">Dokumentmall (valfritt)</label>
      <select id="fil-mall-val" style="width:100%;padding:5px 7px;border:1px solid #ccc;border-radius:3px;font-size:13px;margin-bottom:6px;box-sizing:border-box;">
        <option value="">(ingen mall – enbart fil)</option>
      </select>
      <!-- OCR-sektion – visas om vald mall har kategori 110/111 och PDF är vald -->
      <div id="fil-ocr-sektion" style="display:none;margin-bottom:6px;">
        <button id="btn-fil-ocr" type="button"
          style="width:100%;margin:0;padding:5px;font-size:11px;background:#fff3e0;border:1px solid #ffb74d;border-radius:3px;cursor:pointer;text-align:left;">
          📄 Hämta info från PDF (öppnas i ny flik – återvänd hit)
        </button>
        <div id="fil-ocr-resultat" style="display:none;margin-top:5px;">
          <label style="font-size:10px;color:#555;display:block;margin-bottom:1px;" id="fil-ocr-label">Avsändare:</label>
          <input id="fil-ocr-kontakt" type="text"
            style="width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box;margin-bottom:4px;">
          <label style="font-size:10px;color:#555;display:block;margin-bottom:1px;" id="fil-ocr-datum-label">Ankomstdatum (ÅÅÅÅ-MM-DD):</label>
          <input id="fil-ocr-datum" type="text"
            style="width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box;margin-bottom:4px;">
          <label style="font-size:10px;color:#555;display:block;margin-bottom:1px;">Titel (från PDF):</label>
          <input id="fil-ocr-titel" type="text"
            style="width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box;margin-bottom:2px;">
          <div style="font-size:10px;color:#888;">Tomma fält – mallens eller filnamnets värde används.</div>
        </div>
      </div>
      <div style="display:flex;gap:4px;">
        <button id="btn-fil-starta" style="flex:1;margin:0;padding:6px;font-size:12px;background:#0078d4;color:#fff;border-color:#0078d4;">Ladda upp</button>
        <button id="btn-fil-avbryt" style="width:auto;margin:0;padding:6px;font-size:12px;">Avbryt</button>
      </div>
    </div>
    <button id="btn-batch-upload">Batch: en fil per ärendedokument</button>
    <input type="file" id="batch-fil-input" multiple style="display:none;">
    <!-- Batch-panel: välj dokumentmall och starta -->
    <div id="batch-panel" style="display:none;margin-top:6px;padding:8px;background:#f0f6ff;border:1px solid #c2d8f5;border-radius:4px;">
      <div style="font-size:11px;color:#555;margin-bottom:4px;" id="batch-fil-info"></div>
      <label style="font-size:11px;color:#555;display:block;margin-bottom:3px;">Dokumentmall (valfritt)</label>
      <select id="batch-mall-val" style="width:100%;padding:5px 7px;border:1px solid #ccc;border-radius:3px;font-size:13px;margin-bottom:6px;box-sizing:border-box;">
        <option value="">(ingen mall – enbart fil)</option>
      </select>
      <!-- OCR-sektion för batch – gemensam info för alla filer -->
      <div id="batch-ocr-sektion" style="display:none;margin-bottom:6px;">
        <button id="btn-batch-ocr" type="button"
          style="width:100%;margin:0;padding:5px;font-size:11px;background:#fff3e0;border:1px solid #ffb74d;border-radius:3px;cursor:pointer;text-align:left;">
          📄 Hämta info från PDF (tillämpas på alla filer i batchen)
        </button>
        <div id="batch-ocr-resultat" style="display:none;margin-top:5px;">
          <label style="font-size:10px;color:#555;display:block;margin-bottom:1px;" id="batch-ocr-label">Avsändare:</label>
          <input id="batch-ocr-kontakt" type="text"
            style="width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box;margin-bottom:4px;">
          <label style="font-size:10px;color:#555;display:block;margin-bottom:1px;" id="batch-ocr-datum-label">Ankomstdatum (ÅÅÅÅ-MM-DD):</label>
          <input id="batch-ocr-datum" type="text"
            style="width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box;margin-bottom:4px;">
          <label style="font-size:10px;color:#555;display:block;margin-bottom:1px;">Titel (från PDF):</label>
          <input id="batch-ocr-titel" type="text"
            style="width:100%;padding:4px;font-size:12px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box;margin-bottom:2px;">
          <div style="font-size:10px;color:#888;">Tomma fält – mallens värden används per dokument.</div>
        </div>
      </div>
      <div style="display:flex;gap:4px;">
        <button id="btn-batch-starta" style="flex:1;margin:0;padding:6px;font-size:12px;background:#0078d4;color:#fff;border-color:#0078d4;">Starta batch</button>
        <button id="btn-batch-avbryt" style="width:auto;margin:0;padding:6px;font-size:12px;">Avbryt</button>
      </div>
    </div>
    <div id="fil-status" style="font-size:11px;color:#555;padding:2px 0;display:none;"></div>
  </div>

  <!-- Massregistrering -->
  <div class="grupp">
    <div class="grupp-rubrik">Massregistrering</div>
    <button id="btn-massregistrering">Massregistrering (CSV/tabell)</button>
  </div>

  <div class="grupp">
    <div class="grupp-rubrik">Dagbok</div>
    <button data-action="dagboksblad">Dagboksblad</button>
  </div>

  <div class="grupp">
    <div class="grupp-rubrik">Status</div>
    <button data-action="växlaStatus">Växla status (Öppet ↔ Avslutat)</button>
    <div class="status-rad">
      <select id="status-val">
        <option value="5">B - Öppet</option>
        <option value="6">A - Avslutat</option>
        <option value="17">AH - Avslutat från handläggare</option>
        <option value="8">M - Makulerat</option>
      </select>
      <button id="btn-sätt-status">Sätt status</button>
    </div>
  </div>

  <div class="grupp">
    <div class="grupp-rubrik">Ärendefunktioner</div>
    <button data-action="redigeraEgenskaper">Redigera egenskaper</button>
    <button data-action="registreraUtlaning">Registrera utlåning</button>
    <button data-action="gallring">Gallring</button>
    <button data-action="sparaSomNytt">Spara som nytt ärende</button>
    <button data-action="kopieraHyperlank">Kopiera hyperlänk</button>
    <button data-action="arendesammanfattning">Ärendesammanfattning</button>
    <button data-action="processplan">Tilldela processplan</button>
  </div>

<div style="margin-top: 10px; text-align: right;">
    <a id="hjalp-lank" href="#" style="font-size: 11px; color: #888; text-decoration: none;">? Hjälp</a>
  </div>

  <script src="popup.js"></script>
  <script src="popup-mallar.js"></script>
  <script src="popup-fil.js"></script>
</body>
</html>
